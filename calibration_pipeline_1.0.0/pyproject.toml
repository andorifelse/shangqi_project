[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-scene-pipeline"
version = "1.0.0"
description = "Compact configurable 3DGS capture, camera calibration and BEV stitching pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "opencv-python-headless>=4.8,<6", "plyfile>=1.0,<2"]

[project.scripts]
calibration-pipeline = "calibration_pipeline.pipeline:main"

[tool.setuptools]
packages = ["calibration_pipeline"]
